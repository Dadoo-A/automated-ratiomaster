# Service to add to an existing *ARR stack (Sonarr/Radarr/Prowlarr -> qBittorrent).
#
# Option A (recommended): copy the "ratiomaster" block under "services:" in the
#   stack's docker-compose.yml, next to "qbittorrent". Same file = same default
#   network -> qBittorrent is reachable at http://qbittorrent:8080.
#   Point "build:" at the folder containing Dockerfile + ratiomaster.py.
#
# Option B: keep this file separate and join the stack's network
#   (uncomment the "networks" block at the bottom, with the real network name:
#   docker network ls).
#
# Secrets go in a .env file next to this one (see .env.example).

services:
  ratiomaster:
    build: .
    image: ratiomaster:latest
    container_name: ratiomaster
    restart: unless-stopped
    stop_grace_period: 60s   # leaves time to send event=stopped
    # depends_on:            # Option A only (same file as qbittorrent)
    #   - qbittorrent
    environment:
      QBIT_URL: http://qbittorrent:8080
      QBIT_USER: ${QBIT_USER:-admin}
      QBIT_PASS: ${QBIT_PASS:?set QBIT_PASS in .env}
      POLL_INTERVAL: 30
      CATEGORIES: ""               # empty = all; e.g. "tv-sonarr,radarr,lidarr"
      EXCLUDE_CATEGORIES: ""
      TAGS: ""
      CLIENT: qbittorrent
      UPLOAD_RATE: 500             # KiB/s
      DOWNLOAD_RATE: 2000          # KiB/s
      SEED_AFTER: 0                # seeding minutes after the download duration
      LOG_LEVEL: INFO
      TZ: Europe/Paris
#   networks:
#     - arr

# networks:
#   arr:
#     external: true
#     name: YOUR_STACK_NETWORK_NAME   # e.g. arr_default
