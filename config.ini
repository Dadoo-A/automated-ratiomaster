# Configuration par defaut de ratiomaster.py
# Priorite : ligne de commande > variables d'environnement > ce fichier (voir README.md).

[general]
# Mode par defaut sans argument : cli, watch ou qbit
mode = cli

[client]
# Client emule : qbittorrent, qbittorrent5, utorrent, transmission
# (python ratiomaster.py --list-clients pour la liste)
client = qbittorrent
# Port annonce au tracker (0 = aleatoire entre 20000 et 60000)
port = 0
# Nombre de pairs demandes au tracker
numwant = 200

[speed]
# Vitesses simulees en KiB/s
upload_kib = 500
download_kib = 2000
# Variation aleatoire des vitesses, en % (0 = vitesse constante)
rate_jitter_pct = 0

[session]
# Seed supplementaire (minutes) apres la fin du "telechargement". 0 = arret a la fin du DL.
# Si start_as_seeder = true (ou download_kib = 0) et seed_minutes = 0 : seed illimite (Ctrl+C).
seed_minutes = 0
# Demarrer directement en seed (left=0, downloaded=0)
start_as_seeder = false
# Plafond (secondes) de l'intervalle entre announces. 0 = respecter l'interval du tracker.
max_interval = 0

[network]
# Timeout d'une requete HTTP(S) en secondes
timeout = 20
# Verifier le certificat HTTPS (mettre false pour un certificat auto-signe)
verify_ssl = true
# Delai avant nouvel essai si tous les trackers echouent (secondes)
retry_seconds = 60

[watch]
# Dossier surveille (relatif au script ou absolu)
watch_dir = watch
# Frequence de scan du dossier (secondes)
poll_seconds = 5
# Deplacer les .torrent termines dans watch/done/ et les invalides dans watch/error/
move_done = true

[qbit]
# Mode "qbit" : lit les torrents depuis l'API WebUI de qBittorrent
url = http://qbittorrent:8080
username = admin
password =
# Frequence d'interrogation de l'API (secondes)
poll_interval = 30
# Categories a emuler, separees par des virgules. Vide, * ou all = toutes.
# Categories *ARR habituelles : tv-sonarr, radarr, lidarr, readarr
categories =
# Categories a ignorer
exclude_categories =
# Si renseigne : le torrent doit porter au moins un de ces tags
tags =

[log]
# Fichier de log (vide = console uniquement)
log_file = ratiomaster.log
# DEBUG, INFO, WARNING, ERROR
level = INFO
