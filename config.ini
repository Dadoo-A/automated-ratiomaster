# Default configuration for ratiomaster.py
# Priority: command line > environment variables > this file (see README.md).

[general]
# Default mode when no argument is given: cli, watch or qbit
mode = cli

[client]
# Emulated client: qbittorrent, qbittorrent5, utorrent, transmission
# (python ratiomaster.py --list-clients for the list)
client = qbittorrent
# Port announced to the tracker (0 = random between 20000 and 60000)
port = 0
# Number of peers requested from the tracker
numwant = 200

[speed]
# Simulated rates in KiB/s
upload_kib = 500
download_kib = 2000
# Random rate variation, in % (0 = constant rate)
rate_jitter_pct = 0

[session]
# Extra seeding (minutes) after the "download" ends. 0 = stop when the download ends.
# If start_as_seeder = true (or download_kib = 0) and seed_minutes = 0: unlimited seeding (Ctrl+C).
seed_minutes = 0
# Start directly as a seeder (left=0, downloaded=0)
start_as_seeder = false
# Cap (seconds) on the interval between announces. 0 = obey the tracker's interval.
max_interval = 0

[network]
# HTTP(S) request timeout in seconds
timeout = 20
# Verify the HTTPS certificate (set to false for a self-signed certificate)
verify_ssl = true
# Delay before retrying when every tracker fails (seconds)
retry_seconds = 60

[watch]
# Watched folder (relative to the script, or absolute)
watch_dir = watch
# Folder scan frequency (seconds)
poll_seconds = 5
# Move finished .torrent files to watch/done/ and invalid ones to watch/error/
move_done = true

[qbit]
# "qbit" mode: reads torrents from the qBittorrent WebUI API
url = http://qbittorrent:8080
username = admin
password =
# API polling frequency (seconds)
poll_interval = 30
# Categories to emulate, comma-separated. Empty, * or all = every category.
# Usual *ARR categories: tv-sonarr, radarr, lidarr, readarr
categories =
# Categories to ignore
exclude_categories =
# If set: the torrent must carry at least one of these tags
tags =

[log]
# Log file (empty = console only)
log_file = ratiomaster.log
# DEBUG, INFO, WARNING, ERROR
level = INFO
